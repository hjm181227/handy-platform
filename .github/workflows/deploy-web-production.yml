name: Deploy Web App to Vercel (Production)

on:
  push:
    branches:
      - main
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-web-production.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      # 타입 게이트: 웹 tsc 오류 0 유지 (build:prod 는 tsc 를 돌리지 않으므로 별도 스텝)
      # TODO: 병렬 진행 중인 채팅 작업 커밋 후 continue-on-error 제거해 필수 검사로 전환
      - name: Type check web app
        continue-on-error: true
        run: node node_modules/typescript/bin/tsc --noEmit -p packages/web/tsconfig.json

      - name: Build web app for production
        run: npm run build:prod
        working-directory: packages/web
        env:
          VITE_API_BASE_URL: https://api.h-andy.com
          VITE_CHAT_API_URL: https://chat.h-andy.com
          VITE_ENVIRONMENT: production
          VITE_TOSS_CLIENT_KEY: ${{ secrets.VITE_TOSS_CLIENT_KEY_PRODUCTION }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_KAKAO_APP_KEY: ${{ secrets.VITE_KAKAO_APP_KEY }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel Production
        run: |
          echo "🚀 Deploying to production environment..."

          DEPLOYMENT_URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd packages/web)

          echo ""
          echo "✅ Production deployment successful!"
          echo "📦 Deployed to: $DEPLOYMENT_URL"
          echo "🌐 Domain: www.h-andy.com"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PRODUCTION }}
