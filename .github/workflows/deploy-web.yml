name: Deploy Web App to Vercel

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Build web app with local build method
        run: npm run build:stage
        working-directory: packages/web

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: packages/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Prepare Vercel output structure
        run: |
          mkdir -p .vercel/output
          cp -r dist .vercel/output/static
          echo '{"version":3}' > .vercel/output/config.json
        working-directory: packages/web

      - name: Deploy to Vercel
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # Production deployment - Vercel automatically assigns h-andy.com domain
            DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
            echo "Production deployed to: $DEPLOYMENT_URL"
            echo "Domain h-andy.com automatically assigned to production"
          else
            # Preview deployment - capture full output to extract deployment ID
            DEPLOY_OUTPUT=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
            echo "$DEPLOY_OUTPUT"

            # Extract deployment URL and ID from output
            DEPLOYMENT_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://[a-zA-Z0-9-]+\.vercel\.app' | head -1)
            INSPECT_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://vercel\.com/[^/]+/[^/]+/[a-zA-Z0-9]+' | head -1)
            DEPLOYMENT_ID=$(echo "$INSPECT_URL" | grep -oP '[a-zA-Z0-9]+$')

            echo "Preview deployed to: $DEPLOYMENT_URL"
            echo "Inspect URL: $INSPECT_URL"
            echo "Deployment ID: $DEPLOYMENT_ID"

            # Use Vercel API to update domain target
            if [ -n "$DEPLOYMENT_URL" ]; then
              echo "Waiting 5 seconds for deployment to fully propagate..."
              sleep 5

              # Try method 1: Update domain redirect using project domains API
              echo "🔄 Method 1: Updating domain redirect via project API..."
              DOMAIN_UPDATE=$(curl -s -X PATCH "https://api.vercel.com/v9/projects/${{ secrets.VERCEL_PROJECT_ID }}/domains/www.stage-handy.com" \
                -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
                -H "Content-Type: application/json" \
                -d "{\"redirect\":\"$DEPLOYMENT_URL\"}" \
                -w "\nHTTP_STATUS:%{http_code}")

              HTTP_STATUS_1=$(echo "$DOMAIN_UPDATE" | grep "HTTP_STATUS" | cut -d: -f2)
              RESPONSE_1=$(echo "$DOMAIN_UPDATE" | sed '/HTTP_STATUS/d')

              echo "Response: $RESPONSE_1"
              echo "Status: $HTTP_STATUS_1"

              if [ "$HTTP_STATUS_1" = "200" ] || [ "$HTTP_STATUS_1" = "201" ]; then
                echo "✅ Successfully updated domain redirect!"
              else
                # Try method 2: Use deployment alias API with deployment ID
                echo ""
                echo "🔄 Method 2: Trying deployment alias API..."

                if [ -n "$DEPLOYMENT_ID" ]; then
                  ALIAS_RESPONSE=$(curl -s -X POST "https://api.vercel.com/v2/deployments/$DEPLOYMENT_ID/aliases" \
                    -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
                    -H "Content-Type: application/json" \
                    -d '{"alias":"www.stage-handy.com"}' \
                    -w "\nHTTP_STATUS:%{http_code}")

                  HTTP_STATUS_2=$(echo "$ALIAS_RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
                  RESPONSE_2=$(echo "$ALIAS_RESPONSE" | sed '/HTTP_STATUS/d')

                  echo "Response: $RESPONSE_2"
                  echo "Status: $HTTP_STATUS_2"

                  if [ "$HTTP_STATUS_2" = "200" ] || [ "$HTTP_STATUS_2" = "201" ]; then
                    echo "✅ Successfully created alias!"
                  else
                    echo ""
                    echo "⚠️  Automatic domain aliasing not available with current token permissions"
                    echo "📝 Latest deployment is ready at:"
                    echo "   🌐 Preview URL: $DEPLOYMENT_URL"
                    echo "   🔍 Inspect: $INSPECT_URL"
                    echo ""
                    echo "To view the latest code, use the Preview URL in your WebView temporarily,"
                    echo "or manually assign www.stage-handy.com in Vercel Dashboard → Deployments → Select this deployment → Assign Domain"
                  fi
                fi
              fi
            else
              echo "⚠️  Could not extract deployment URL"
            fi
          fi
        working-directory: packages/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
