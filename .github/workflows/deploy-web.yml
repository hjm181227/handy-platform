name: Deploy Web App to Vercel

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Build web app with local build method
        run: npm run build:stage
        working-directory: packages/web

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Prepare Vercel output structure with compiled API functions
        run: |
          # Static files (frontend assets)
          mkdir -p .vercel/output/static
          cp -r dist/* .vercel/output/static/

          # Serverless function directory
          mkdir -p .vercel/output/functions/api/proxy.func

          # Step 1: TypeScript compilation using esbuild to _compiled.js
          npx esbuild api/proxy.ts \
            --bundle \
            --platform=node \
            --target=node20 \
            --format=cjs \
            --outfile=.vercel/output/functions/api/proxy.func/_compiled.js \
            --external:@vercel/node

          # Step 2: Post-process to fix CommonJS export format
          # esbuild's __toCommonJS produces getter-based exports that don't work with Node.js require()
          # We need to remove the export wrapper and add direct module.exports = handler
          node << 'CONVERSION_SCRIPT'
          const fs = require('fs');

          console.log('🔄 Converting esbuild output to working CommonJS format...');

          // Read compiled file
          const code = fs.readFileSync('.vercel/output/functions/api/proxy.func/_compiled.js', 'utf8');

          // Remove problematic export code
          let fixed = code
            .replace(/module\.exports = __toCommonJS\(proxy_exports\);/, '')
            .replace(/var proxy_exports = \{\};/, '')
            .replace(/__export\(proxy_exports, \{[\s\S]*?\}\);/, '');

          // Add BOTH exports to support different require patterns
          // Vercel may use require('./index').default or require('./index')
          fixed = fixed + '\n// Export for Vercel compatibility\nexports.default = handler;\nmodule.exports = handler;\n';

          // Write to index.js
          fs.writeFileSync('.vercel/output/functions/api/proxy.func/index.js', fixed);

          console.log('✅ Export conversion complete!');
          CONVERSION_SCRIPT

          # Create package.json with @vercel/node dependency
          # IMPORTANT: Must create this BEFORE testing to override parent "type": "module"
          cat > .vercel/output/functions/api/proxy.func/package.json << 'EOF'
          {
            "type": "commonjs",
            "dependencies": {
              "@vercel/node": "^3.0.0"
            }
          }
          EOF

          # Function runtime configuration
          cat > .vercel/output/functions/api/proxy.func/.vc-config.json << 'EOF'
          {
            "runtime": "nodejs20.x",
            "handler": "index",
            "launcherType": "Nodejs"
          }
          EOF

          # Build output configuration with routes
          cat > .vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              {
                "src": "/api/(.*)",
                "dest": "/api/proxy?path=$1"
              },
              {
                "handle": "filesystem"
              },
              {
                "src": "/(.*)",
                "dest": "/index.html"
              }
            ]
          }
          EOF

          # Debug: Verify module.exports works correctly (after package.json is created)
          echo "=== Last 15 lines of converted index.js ==="
          tail -15 .vercel/output/functions/api/proxy.func/index.js

          echo "=== Testing module.exports with package.json in place ==="
          node << 'TEST_SCRIPT'
          const handler = require('./.vercel/output/functions/api/proxy.func/index.js');
          console.log('Type of handler:', typeof handler);
          console.log('Is function:', typeof handler === 'function');
          if (typeof handler === 'function') {
            console.log('✅ Handler exports correctly as a function!');
          } else {
            console.error('❌ Handler is not a function!');
            console.error('Type:', typeof handler);
            console.error('Keys:', Object.keys(handler));
            process.exit(1);
          }
          TEST_SCRIPT

          # Debug: Check what was created
          echo "=== .vercel/output structure ==="
          ls -lah .vercel/output/
          echo "=== Static files ==="
          ls -lah .vercel/output/static/ | head -10
          echo "=== Function files ==="
          ls -lah .vercel/output/functions/api/proxy.func/
          echo "=== config.json ==="
          cat .vercel/output/config.json
        working-directory: packages/web

      - name: Deploy to Vercel and set alias
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # Production deployment
            echo "🚀 Deploying to production environment..."

            # Ensure domain is registered at team level
            echo "🔧 Registering domain at team level..."
            vercel domains add h-andy.com --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null || echo "✓ Domain already at team level"

            DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})

            echo ""
            echo "✅ Production deployment successful!"
            echo "📦 Deployed to: $DEPLOYMENT_URL"

            # Set alias to h-andy.com using REST API (more reliable than CLI)
            echo "🔗 Setting alias to h-andy.com via REST API..."

            # Extract deployment URL without protocol (Vercel API accepts this format)
            DEPLOYMENT_URL_NO_PROTOCOL=$(echo $DEPLOYMENT_URL | sed 's|https://||')
            echo "📝 Deployment URL (no protocol): $DEPLOYMENT_URL_NO_PROTOCOL"

            # Assign domain via Vercel REST API
            ALIAS_RESPONSE=$(curl -s -X POST "https://api.vercel.com/v2/deployments/${DEPLOYMENT_URL_NO_PROTOCOL}/aliases" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"alias": "h-andy.com"}')

            echo "📡 API Response: $ALIAS_RESPONSE"

            # Check if alias was successful
            if echo "$ALIAS_RESPONSE" | grep -q '"uid"'; then
              echo "✅ Domain alias set successfully!"
              echo "🌐 Domain: h-andy.com"
            else
              echo "❌ Domain alias failed!"
              echo "🌐 Domain: h-andy.com (manual verification needed)"
            fi
          else
            # Staging deployment (develop branch)
            echo "🔄 Deploying to staging environment..."

            # Ensure domain is registered at team level
            echo "🔧 Registering domain at team level..."
            vercel domains add www.stage-handy.com --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null || echo "✓ Domain already at team level"

            DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})

            echo ""
            echo "✅ Staging deployment successful!"
            echo "📦 Deployed to: $DEPLOYMENT_URL"

            # Set alias to www.stage-handy.com using REST API (more reliable than CLI)
            echo "🔗 Setting alias to www.stage-handy.com via REST API..."

            # Extract deployment URL without protocol (Vercel API accepts this format)
            DEPLOYMENT_URL_NO_PROTOCOL=$(echo $DEPLOYMENT_URL | sed 's|https://||')
            echo "📝 Deployment URL (no protocol): $DEPLOYMENT_URL_NO_PROTOCOL"

            # Assign domain via Vercel REST API
            ALIAS_RESPONSE=$(curl -s -X POST "https://api.vercel.com/v2/deployments/${DEPLOYMENT_URL_NO_PROTOCOL}/aliases" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"alias": "www.stage-handy.com"}')

            echo "📡 API Response: $ALIAS_RESPONSE"

            # Check if alias was successful
            if echo "$ALIAS_RESPONSE" | grep -q '"uid"'; then
              echo "✅ Domain alias set successfully!"
              echo "🌐 Domain: www.stage-handy.com"
            else
              echo "❌ Domain alias failed!"
              echo "🌐 Domain: www.stage-handy.com (manual verification needed)"
            fi
          fi
        working-directory: packages/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
