name: Deploy Web App to Vercel

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Build web app with local build method
        run: npm run build:stage
        working-directory: packages/web

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: packages/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Prepare Vercel output structure with compiled API functions
        run: |
          # Static files (frontend assets)
          mkdir -p .vercel/output/static
          cp -r dist/* .vercel/output/static/

          # Serverless function directory
          mkdir -p .vercel/output/functions/api/proxy.func

          # TypeScript compilation using esbuild - fast and bundles dependencies
          npx esbuild api/proxy.ts \
            --bundle \
            --platform=node \
            --target=node20 \
            --format=cjs \
            --outfile=.vercel/output/functions/api/proxy.func/index.js \
            --external:@vercel/node

          # Create package.json with @vercel/node dependency
          cat > .vercel/output/functions/api/proxy.func/package.json << 'EOF'
          {
            "type": "commonjs",
            "dependencies": {
              "@vercel/node": "^3.0.0"
            }
          }
          EOF

          # Function runtime configuration
          cat > .vercel/output/functions/api/proxy.func/.vc-config.json << 'EOF'
          {
            "runtime": "nodejs20.x",
            "handler": "index.js",
            "launcherType": "Nodejs"
          }
          EOF

          # Build output configuration with routes
          cat > .vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              {
                "src": "/api/(.*)",
                "dest": "/api/proxy?path=$1"
              },
              {
                "handle": "filesystem"
              },
              {
                "src": "/(.*)",
                "dest": "/index.html"
              }
            ]
          }
          EOF
        working-directory: packages/web

      - name: Deploy to Vercel with Git metadata
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # Production deployment with Git metadata
            echo "🚀 Deploying to production environment..."

            DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod \
              -m githubDeployment="1" \
              -m githubCommitRef="${{ github.ref_name }}" \
              -m githubCommitSha="${{ github.sha }}" \
              -m githubCommitMessage="${{ github.event.head_commit.message }}" \
              -m githubCommitAuthorName="${{ github.event.head_commit.author.name }}" \
              -m githubOrg="${{ github.repository_owner }}" \
              -m githubRepo="${{ github.event.repository.name }}" \
              --token=${{ secrets.VERCEL_TOKEN }})

            echo ""
            echo "✅ Production deployment successful!"
            echo "📦 Deployed to: $DEPLOYMENT_URL"
            echo "🌐 Domain: h-andy.com (automatically assigned)"
          else
            # Staging deployment with Git metadata for Branch Domain assignment
            echo "🔄 Deploying to staging environment..."

            DEPLOY_OUTPUT=$(vercel deploy --prebuilt --prod \
              -m githubDeployment="1" \
              -m githubCommitRef="${{ github.ref_name }}" \
              -m githubCommitSha="${{ github.sha }}" \
              -m githubCommitMessage="${{ github.event.head_commit.message }}" \
              -m githubCommitAuthorName="${{ github.event.head_commit.author.name }}" \
              -m githubOrg="${{ github.repository_owner }}" \
              -m githubRepo="${{ github.event.repository.name }}" \
              --token=${{ secrets.VERCEL_TOKEN }} 2>&1)

            echo "$DEPLOY_OUTPUT"

            # Extract deployment URL
            DEPLOYMENT_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://[a-zA-Z0-9-]+\.vercel\.app' | head -1)

            echo ""
            echo "✅ Staging deployment successful!"
            echo "📦 Deployed to: $DEPLOYMENT_URL"
            echo "🌐 Domain: www.stage-handy.com (automatically assigned via Branch Domain)"
            echo "ℹ️  Git metadata passed - Vercel will recognize this as develop branch deployment"
          fi
        working-directory: packages/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
