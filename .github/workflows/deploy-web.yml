name: Deploy Web App to Vercel

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Build web app with local build method
        run: npm run build:stage
        working-directory: packages/web

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: packages/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Prepare Vercel output structure
        run: |
          mkdir -p .vercel/output
          cp -r dist .vercel/output/static
          echo '{"version":3}' > .vercel/output/config.json
        working-directory: packages/web

      - name: Deploy to Vercel
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
            echo "Production deployed to: $DEPLOYMENT_URL"
            vercel alias $DEPLOYMENT_URL h-andy.com --token=${{ secrets.VERCEL_TOKEN }}
            echo "Aliased to: h-andy.com"
          else
            DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
            echo "Preview deployed to: $DEPLOYMENT_URL"
            vercel alias $DEPLOYMENT_URL www.stage-handy.com --token=${{ secrets.VERCEL_TOKEN }}
            echo "Aliased to: www.stage-handy.com"
          fi
        working-directory: packages/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
