name: Deploy Web App to Vercel

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Build web app with local build method
        run: npm run build:stage
        working-directory: packages/web

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: packages/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Prepare Vercel output structure
        run: |
          mkdir -p .vercel/output
          cp -r dist .vercel/output/static
          echo '{"version":3}' > .vercel/output/config.json
        working-directory: packages/web

      - name: Deploy to Vercel
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # Production deployment - Vercel automatically assigns h-andy.com domain
            DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
            echo "Production deployed to: $DEPLOYMENT_URL"
            echo "Domain h-andy.com automatically assigned to production"
          else
            # Preview deployment - capture full output to extract deployment ID
            DEPLOY_OUTPUT=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
            echo "$DEPLOY_OUTPUT"

            # Extract deployment URL and ID from output
            DEPLOYMENT_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://[a-zA-Z0-9-]+\.vercel\.app' | head -1)
            INSPECT_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://vercel\.com/[^/]+/[^/]+/[a-zA-Z0-9]+' | head -1)
            DEPLOYMENT_ID=$(echo "$INSPECT_URL" | grep -oP '[a-zA-Z0-9]+$')

            echo "Preview deployed to: $DEPLOYMENT_URL"
            echo "Inspect URL: $INSPECT_URL"
            echo "Deployment ID: $DEPLOYMENT_ID"

            # Use Vercel API to assign domain alias
            if [ -n "$DEPLOYMENT_URL" ]; then
              # Extract hostname from deployment URL (web-xxxxx-team.vercel.app)
              DEPLOYMENT_HOST=$(echo "$DEPLOYMENT_URL" | sed 's/https:\/\///')

              echo "Waiting 5 seconds for deployment to fully propagate..."
              sleep 5

              echo "Assigning domain www.stage-handy.com to $DEPLOYMENT_HOST..."
              API_RESPONSE=$(curl -s -X POST "https://api.vercel.com/v2/deployments/$DEPLOYMENT_HOST/aliases" \
                -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
                -H "Content-Type: application/json" \
                -d '{"alias":"www.stage-handy.com"}' \
                -w "\nHTTP_STATUS:%{http_code}")

              HTTP_STATUS=$(echo "$API_RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
              RESPONSE_BODY=$(echo "$API_RESPONSE" | sed '/HTTP_STATUS/d')

              echo "API Response: $RESPONSE_BODY"
              echo "HTTP Status: $HTTP_STATUS"

              if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
                echo "✅ Successfully aliased to: https://www.stage-handy.com"
              else
                echo "⚠️  Domain aliasing failed (Status: $HTTP_STATUS)"
                echo "📝 Please manually assign www.stage-handy.com to this deployment in Vercel Dashboard:"
                echo "   Deployment URL: $DEPLOYMENT_URL"
                echo "   Inspect URL: $INSPECT_URL"
              fi
            else
              echo "⚠️  Could not extract deployment URL"
            fi
          fi
        working-directory: packages/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
