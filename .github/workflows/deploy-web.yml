name: Deploy Web App to Vercel

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Build web app with local build method
        run: npm run build:stage
        working-directory: packages/web

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: packages/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Prepare Vercel output structure
        run: |
          mkdir -p .vercel/output
          cp -r dist .vercel/output/static
          echo '{"version":3}' > .vercel/output/config.json
        working-directory: packages/web

      - name: Deploy to Vercel
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # Production deployment - Vercel automatically assigns h-andy.com domain
            DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
            echo "✅ Production deployed to: $DEPLOYMENT_URL"
            echo "   Domain: h-andy.com (automatically assigned)"
          else
            # Staging deployment with vercel promote
            echo "🔄 Deploying to staging environment..."

            # Deploy with production quality but skip domain assignment
            DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --skip-domain --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /dev/tty | grep -oP 'https://[a-zA-Z0-9-]+\.vercel\.app' | head -1)

            if [ -z "$DEPLOYMENT_URL" ]; then
              echo "⚠️  --skip-domain flag not supported, trying alternative method..."
              # Fallback: deploy as preview
              DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
              echo "📦 Preview deployment created: $DEPLOYMENT_URL"
              echo "⚠️  Manual domain assignment required in Vercel Dashboard"
            else
              echo "📦 Deployment created: $DEPLOYMENT_URL"
              echo ""
              echo "🔄 Promoting to www.stage-handy.com..."

              # Promote deployment to production domain
              vercel promote $DEPLOYMENT_URL --token=${{ secrets.VERCEL_TOKEN }}

              echo "✅ Successfully promoted to: https://www.stage-handy.com"
            fi
          fi
        working-directory: packages/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
