buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23  // React Native 0.74+ requires minSdk 23
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.3.13750724"  // NDK r27c - 16KB 페이지 크기 지원
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.6.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()

        // JSC from node_modules for proper dependency resolution
        maven {
            // Local JSC package repository
            url("$rootDir/../../node_modules/jsc-android/dist")
        }

        // React Native repositories
        maven { url 'https://www.jitpack.io' }
    }
}

// Force kotlinx-coroutines to 1.8.1 for Kotlin 1.9.x compatibility
// Inject 16KB page size CMake flag into all subprojects with Android plugin
subprojects { sub ->
    sub.pluginManager.withPlugin('com.android.library') {
        sub.android {
            defaultConfig {
                externalNativeBuild {
                    cmake {
                        arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                    }
                }
            }
        }
    }
    sub.pluginManager.withPlugin('com.android.application') {
        sub.android {
            defaultConfig {
                externalNativeBuild {
                    cmake {
                        arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                    }
                }
            }
        }
    }

    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.8.1'
        }
    }
}
