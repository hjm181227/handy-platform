# Nail Detector Training Configuration v1
# YOLOv8 nano model for nail detection

# Model
model:
  base: yolov8n  # nano version for mobile
  pretrained: true
  num_classes: 6  # credit_card, nail_thumb, nail_index, nail_middle, nail_ring, nail_little

# Dataset
dataset:
  name: nail_v1
  path: ../datasets/nail_v1
  train: images/train
  val: images/val
  test: images/test

# Training
training:
  epochs: 100
  batch_size: 16
  image_size: 640
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01  # final learning rate = lr0 * lrf
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  patience: 20  # early stopping patience

# Augmentation
augmentation:
  hsv_h: 0.015  # hue
  hsv_s: 0.7    # saturation
  hsv_v: 0.4    # value
  degrees: 10   # rotation
  translate: 0.1
  scale: 0.5
  shear: 5
  flipud: 0.0   # no vertical flip (nails have orientation)
  fliplr: 0.5   # horizontal flip ok
  mosaic: 0.5
  mixup: 0.1

# Export
export:
  formats:
    - pytorch
    - onnx
    - tflite
    - coreml
  optimize: true  # optimize for mobile
  int8: false     # keep float16 for accuracy

# Experiment tracking
mlflow:
  experiment_name: nail_detector
  tracking_uri: ./mlruns

# Checkpointing
checkpoint:
  save_best: true
  save_last: true
  save_period: 10  # save every N epochs
