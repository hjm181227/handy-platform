# Nail Segmentation Model Configuration
# ResNet101 + DeepLabV3+ trained on Kaggle

model:
  architecture: DeepLabV3Plus
  encoder: resnet101
  encoder_weights: null  # Custom trained on Kaggle
  classes: 1
  activation: sigmoid

input:
  size: 640  # Match Kaggle training config
  channels: 3
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

inference:
  threshold: 0.5
  min_area: 100  # Minimum pixel area for valid nail region

training:
  dataset: vpapenko/nail-segmentation-dataset
  platform: kaggle
  notes: ResNet101 trained on Kaggle GPU T4/P100
