# Nail Segmentation Model Configuration
# ResNet101 + DeepLabV3+ trained on Kaggle
# v0.0.1: Mixed Training — CLAHE + Dice+1.5xBCE + 800px + drop_last

model:
  architecture: DeepLabV3Plus
  encoder: resnet101
  encoder_weights: null  # Custom trained on Kaggle
  classes: 1
  activation: null  # Raw logits (sigmoid applied in post-processing)

input:
  size: 800  # 측정 정밀도 향상 (1px ≈ 0.107mm)
  channels: 3
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

inference:
  threshold: 0.5  # Update after threshold optimization
  clahe:
    enabled: true
    clip_limit: 4.0
    tile_grid_size: [8, 8]
  min_area: 100  # Minimum pixel area for valid nail region

training:
  dataset: mixed (vpapenko + roboflow + thumb)
  platform: kaggle
  notes: Mixed training with drop_last=True, CLAHE + Dice+1.5xBCE + 800px
